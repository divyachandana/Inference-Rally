<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightWatch</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --line:#30363d;
          --ok:#3fb950; --l1:#d29922; --l2:#f0883e; --l3:#f85149; --accent:#58a6ff; --room:#1f2630; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; } h1 span { color:var(--muted); font-weight:400; font-size:13px; margin-left:6px; }
  .clock { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; margin-left:auto; }
  .mode { padding:4px 10px; border-radius:12px; font-weight:700; font-size:12px; }
  .mode.night { background:#1d2b4f; color:#a5c8ff; } .mode.day { background:#3b3415; color:#f2d06b; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; width:100%; }
  .chip { padding:3px 9px; border:1px solid var(--line); border-radius:10px; font-size:12px; color:var(--muted); background:var(--panel); }
  .chip b { color:var(--ink); }
  main { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; padding:14px 18px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  .panel h2 { margin:0 0 10px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  svg { width:100%; height:auto; display:block; }
  .alert { border:1px solid var(--line); border-left:6px solid var(--l1); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#0f141a; }
  .alert.l2 { border-left-color:var(--l2); } .alert.l3 { border-left-color:var(--l3); background:#2a1213; animation:flash 1s infinite; }
  @keyframes flash { 50% { background:#3a1517; } }
  .alert .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .lvl { font-weight:800; font-size:12px; } .l1t { color:var(--l1); } .l2t { color:var(--l2); } .l3t { color:var(--l3); }
  .title { font-weight:600; margin:4px 0; }
  .due { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .hist { margin:6px 0 0; padding:0; list-style:none; font-size:12px; color:var(--muted); }
  .hist li { padding:1px 0; } .hist b { color:var(--ink); font-weight:500; }
  .tips { font-size:12px; margin-top:6px; color:var(--ok); }
  .btns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button { font:inherit; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .ack { background:var(--accent); color:#04122a; font-weight:600; } .res { background:#238636; color:#fff; }
  .none { color:var(--muted); padding:14px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; min-width:60px; }
  .bar div { height:100%; }
  ul.log { list-style:none; margin:0; padding:0; max-height:240px; overflow:auto; font-size:12px; }
  ul.log li { padding:4px 0; border-bottom:1px solid var(--line); }
  ul.log .t { color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums; }
  .k-L1 { color:var(--l1); } .k-L2 { color:var(--l2); } .k-L3, .k-contact { color:var(--l3); } .k-ack, .k-resolved { color:var(--ok); }
  .wide { grid-column:1 / -1; }
</style>
</head>
<body>
<header>
  <h1>NightWatch <span id="facility"></span></h1>
  <span class="mode" id="mode">–</span>
  <div class="clock" id="clock">--:--:--</div>
  <div class="chips">
    <span class="chip">Night staff on duty <b id="staff">–</b></span>
    <span class="chip">Outside <b id="temp">–</b></span>
    <span class="chip">Model <b id="model">–</b> on <b id="device">–</b></span>
    <span class="chip">Per check <b id="lat">–</b></span>
    <span class="chip">Hallway camera <b id="cam">off</b></span>
    <span class="chip">Internet needed <b>No</b></span>
    <span class="chip">Visits logged today <b id="visits">0</b></span>
    <span class="chip">Median time to acknowledge <b id="ackt">–</b></span>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Floor plan</h2>
    <svg id="map" viewBox="0 0 564 290" role="img" aria-label="Floor plan with residents and exits"></svg>
  </section>
  <section class="panel">
    <h2>Active alerts</h2>
    <div id="alerts"></div>
  </section>
  <section class="panel">
    <h2>Residents</h2>
    <table><thead><tr><th>Resident</th><th>Wander risk</th><th>Now</th><th>HR</th><th>Unusual for now</th></tr></thead>
      <tbody id="residents"></tbody></table>
  </section>
  <section class="panel">
    <h2>Event log</h2>
    <ul class="log" id="log"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const heat = (u) => (u >= 0.8 ? 'var(--l3)' : u >= 0.6 ? 'var(--l2)' : u >= 0.35 ? 'var(--l1)' : 'var(--ok)');
function residentXY(r, exits, i) {
  const front = exits.find((e) => e.id === 'front');
  if (r.zone === 'room') return [r.x, 92];
  if (r.zone === 'corridor') return [r.x, 150];
  if (r.zone === 'common') return [190 + i * 22, 238];
  if (r.zone === 'exit') return [front.x - 42, front.y - 8];
  return [535, front.y - 8]; // outside the building
}

function exitLabel(e) {
  if (e.y < 40) return e.x > 400 ? `x="${e.x - 14}" y="${e.y + 4}" text-anchor="end"` : `x="${e.x + 14}" y="${e.y + 4}" text-anchor="start"`;
  if (e.x > 400) return `x="${e.x - 14}" y="${e.y + 4}" text-anchor="end"`;
  if (e.x < 60) return `x="${e.x + 14}" y="${e.y + 4}" text-anchor="start"`;
  return `x="${e.x}" y="${e.y + 26}" text-anchor="middle"`;
}

function drawMap(s) {
  const rooms = s.residents.map((r) => `
    <rect x="${r.x - 34}" y="36" width="68" height="80" rx="4" fill="var(--room)" stroke="var(--line)"/>
    <text x="${r.x}" y="52" fill="var(--muted)" font-size="10" text-anchor="middle">Room ${esc(r.room)}</text>`).join('');
  const exits = s.exits.map((e) => `
    <g><rect x="${e.x - 9}" y="${e.y - 9}" width="18" height="18" rx="3" fill="${e.open ? 'var(--l3)' : '#0d1117'}" stroke="${e.open ? 'var(--l3)' : 'var(--muted)'}"/>
    <text ${exitLabel(e)} fill="${e.open ? 'var(--l3)' : 'var(--muted)'}" font-size="10" font-weight="${e.open ? 700 : 400}">${esc(e.short || e.label)}${e.open ? ' · OPEN' : ''}</text></g>`).join('');
  const people = s.residents.map((r, i) => {
    const [x, y] = residentXY(r, s.exits, i);
    return `<g><circle cx="${x}" cy="${y}" r="9" fill="${heat(r.unusual)}" stroke="#0d1117" stroke-width="2"/>
      <text x="${x}" y="${y + 21}" fill="var(--ink)" font-size="10" text-anchor="middle">${esc(r.id)}${r.in_bed ? ' · bed' : ''}</text></g>`;
  }).join('');
  $('map').innerHTML = `
    <rect x="10" y="10" width="480" height="270" rx="8" fill="#0f141a" stroke="var(--line)"/>
    <rect x="500" y="10" width="58" height="270" rx="8" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
    <text x="529" y="26" fill="var(--muted)" font-size="10" text-anchor="middle">Outside</text>
    ${rooms}
    <rect x="20" y="128" width="460" height="44" fill="#121820"/>
    <text x="250" y="166" fill="var(--muted)" font-size="10" text-anchor="middle">Corridor</text>
    <rect x="160" y="196" width="170" height="76" rx="4" fill="var(--room)" stroke="var(--line)"/>
    <text x="245" y="212" fill="var(--muted)" font-size="10" text-anchor="middle">Common room</text>
    ${exits}${people}`;
}

function alertCard(a) {
  const due = a.acked_by ? `Acknowledged by ${esc(a.acked_by)}` :
    a.escalates_in_s != null ? (a.level < 3 ? `Escalates in ${a.escalates_in_s} s` : `Next contact step in ${a.escalates_in_s} s`) : '';
  return `<div class="alert l${a.level}">
    <div class="top"><span class="lvl l${a.level}t">LEVEL ${a.level} · ${['', 'HEADS-UP', 'URGENT', 'EMERGENCY'][a.level]}</span><span class="due">${due}</span></div>
    <div class="title">${esc(a.title)}</div>
    ${a.description ? `<div class="due">Looks like: ${esc(a.description)} · Room ${esc(a.room)}</div>` : ''}
    ${a.suggestions.length ? `<div class="tips">What has worked before: ${a.suggestions.map(esc).join(' · ')}</div>` : ''}
    <ul class="hist">${a.history.map(([t, h]) => `<li>${esc(t)} <b>${esc(h)}</b></li>`).join('')}</ul>
    <div class="btns">${a.acked_by ? '' : `<button class="ack" data-ack="${a.id}">Acknowledge</button>`}
      <button class="res" data-res="${a.id}">Found safe</button></div></div>`;
}

const SEV = { 1: ['routine', 'var(--ok)'], 2: ['notable', 'var(--l1)'], 3: ['escalation', 'var(--l3)'] };
function recordCard(a) {
  const r = a.record || {};
  const [label, color] = SEV[r.severity] || ['–', 'var(--muted)'];
  const fields = ['category', 'behaviour', 'affect', 'frequency', 'time_of_day', 'night_band', 'location_type', 'trigger', 'intervention', 'outcome']
    .filter((k) => r[k]).map((k) => `<span style="color:var(--muted)">${k.replace(/_/g, ' ')}:</span> ${esc(r[k])}`).join(' · ');
  return `<div class="alert" style="border-left-color:${color};animation:none;background:#0f141a">
    <div class="top"><span class="lvl" style="color:${color}">SEVERITY ${r.severity ?? '–'} · ${label.toUpperCase()}</span><span class="due">${esc(a.resident || '')}</span></div>
    <div class="title">${esc(a.title)}</div>
    <div class="due">${esc(a.resolved)}</div>
    <div style="font-size:12px;margin-top:6px">${fields}</div>
    <div class="due" style="margin-top:4px">${esc(r.draft_by || '')}</div></div>`;
}

async function post(url, body) {
  await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  tick();
}
document.addEventListener('click', (e) => {
  const ack = e.target.dataset.ack, res = e.target.dataset.res;
  if (ack) post('/api/ack', { alert: +ack, by: 'Nurse station' });
  if (res) post('/api/resolve', { alert: +res, outcome: 'Found safe, returned to room' });
});

async function tick() {
  let s;
  try { s = await (await fetch('/api/state')).json(); } catch { return; }
  $('facility').textContent = s.facility;
  $('clock').textContent = s.clock;
  $('mode').textContent = s.night ? 'NIGHT MODE' : 'DAY MODE';
  $('mode').className = 'mode ' + (s.night ? 'night' : 'day');
  $('staff').textContent = s.night_staff;
  $('temp').textContent = `${s.outside_temp_c} °C`;
  $('model').textContent = s.scorer.name;
  $('device').textContent = s.scorer.device;
  $('lat').textContent = s.scorer.p50_ms == null ? '–' : `${s.scorer.p50_ms.toFixed(2)} ms`;
  $('visits').textContent = s.stats.visits_today;
  const live = (s.cameras || []).filter((c) => c.live);
  $('cam').textContent = live.length
    ? `${live.map((c) => (c.persons ? 'person seen' : 'clear')).join(', ')} · ${s.camera_p50_ms} ms/frame`
    : 'off';
  $('ackt').textContent = s.stats.median_ack_s == null ? '–' : `${s.stats.median_ack_s} s`;
  drawMap(s);
  $('alerts').innerHTML = (s.alerts.length ? s.alerts.map(alertCard).join('') : '<div class="none">No active alerts.</div>')
    + (s.recent.length ? `<h2 style="margin-top:14px">Closed tonight · draft care records</h2>${s.recent.slice().reverse().map(recordCard).join('')}` : '');
  $('residents').innerHTML = s.residents.map((r) => `<tr>
    <td><b>${esc(r.id)}</b><br><span style="color:var(--muted);font-size:12px">${esc(r.pattern)}</span></td>
    <td>${Math.round(r.risk * 100)}%</td>
    <td>${r.in_bed ? 'In bed' : esc(r.zone)}</td>
    <td>${r.hr ? Math.round(r.hr) : '–'}</td>
    <td><div class="bar"><div style="width:${r.unusual * 100}%;background:${heat(r.unusual)}"></div></div>${Math.round(r.unusual * 100)}%</td></tr>`).join('');
  $('log').innerHTML = s.events.map((e) => `<li><span class="t">${esc(e.t)}</span><span class="k-${esc(e.kind)}">${esc(e.text)}</span></li>`).join('');
}
setInterval(tick, 700); tick();
</script>
</body>
</html>
