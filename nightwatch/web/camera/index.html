<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightWatch Camera</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --line:#30363d; --hit:#f0883e; --ok:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,"Segoe UI",sans-serif; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; } .note { color:var(--muted); margin:0 0 12px; max-width:720px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  select, button { font:inherit; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  button.go { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  .stage { position:relative; width:min(640px, 100%); aspect-ratio:1; background:#000; border-radius:10px; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { padding:3px 9px; border:1px solid var(--line); border-radius:10px; font-size:12px; color:var(--muted); background:var(--panel); }
  .chip b { color:var(--ink); }
  .status { font-size:16px; font-weight:700; margin-top:10px; }
  video { display:none; }
</style>
</head>
<body>
<h1>Hallway camera</h1>
<p class="note">Person detection runs on this computer through ExecuTorch. Each frame is analysed in memory and
dropped: nothing is recorded, stored or sent off the device. Privacy view (on by default) shows a blurred image.</p>
<div class="bar">
  <select id="cam"></select>
  <button class="go" id="start">Start camera</button>
  <label><input type="checkbox" id="privacy" checked> Privacy view (blur)</label>
</div>
<div class="stage"><canvas id="view" width="640" height="640"></canvas></div>
<div class="status" id="status">Camera off</div>
<div class="chips">
  <span class="chip">Model <b id="model">–</b> on <b id="device">–</b></span>
  <span class="chip">Per frame <b id="ms">–</b></span>
  <span class="chip">Frames/s <b id="fps">–</b></span>
  <span class="chip">Frames stored <b>0</b></span>
</div>
<video id="video" playsinline muted></video>
<canvas id="grab" width="320" height="320" style="display:none"></canvas>
<script>
const $ = (id) => document.getElementById(id);
const view = $('view').getContext('2d'), grab = $('grab').getContext('2d');
let boxes = [], running = false, sent = [];

(async () => {
  const s = await (await fetch('/api/state')).json();
  $('cam').innerHTML = (s.cameras || []).map((c) => `<option value="${c.id}">${c.label}</option>`).join('');
})();

function square(video) {
  const side = Math.min(video.videoWidth, video.videoHeight);
  return [(video.videoWidth - side) / 2, (video.videoHeight - side) / 2, side, side];
}

function draw() {
  const v = $('video');
  if (v.readyState >= 2) {
    view.filter = $('privacy').checked ? 'blur(14px) grayscale(0.6)' : 'none';
    view.drawImage(v, ...square(v), 0, 0, 640, 640);
    view.filter = 'none';
    for (const b of boxes) {
      view.strokeStyle = '#f0883e'; view.lineWidth = 4;
      view.strokeRect(b.x1 * 640, b.y1 * 640, (b.x2 - b.x1) * 640, (b.y2 - b.y1) * 640);
      view.fillStyle = '#f0883e'; view.font = 'bold 18px system-ui';
      view.fillText(`person ${Math.round(b.score * 100)}%`, b.x1 * 640 + 6, Math.max(20, b.y1 * 640 - 6));
    }
  }
  requestAnimationFrame(draw);
}

async function loop() {
  const v = $('video');
  while (running) {
    grab.drawImage(v, ...square(v), 0, 0, 320, 320);
    const jpeg = $('grab').toDataURL('image/jpeg', 0.7);
    try {
      const r = await (await fetch('/api/frame', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ camera: $('cam').value, jpeg }) })).json();
      if (r.error) { $('status').textContent = r.error; await new Promise((ok) => setTimeout(ok, 1000)); continue; }
      boxes = r.boxes;
      $('model').textContent = r.model; $('device').textContent = r.device; $('ms').textContent = `${r.ms} ms`;
      $('status').textContent = boxes.length ? `Person detected (${boxes.length})` : 'No one in view';
      $('status').style.color = boxes.length ? 'var(--hit)' : 'var(--ok)';
      const now = performance.now(); sent = sent.filter((t) => now - t < 2000); sent.push(now);
      $('fps').textContent = (sent.length / 2).toFixed(1);
    } catch { $('status').textContent = 'Server not reachable'; }
    await new Promise((ok) => setTimeout(ok, 150));
  }
}

$('start').onclick = async () => {
  if (running) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    $('video').srcObject = stream; await $('video').play();
    running = true; $('start').textContent = 'Camera on'; loop(); draw();
  } catch (e) { $('status').textContent = 'Camera unavailable: ' + e.message; }
};
</script>
</body>
</html>
