<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightWatch Sensor Simulator</title>
<style>
  :root { --bg:#f6f8fa; --ink:#1f2328; --muted:#656d76; --line:#d0d7de; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,"Segoe UI",sans-serif; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; } p.note { color:var(--muted); margin:0 0 14px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  h2 { font-size:13px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  button { font:inherit; padding:7px 12px; margin:3px; border:1px solid var(--line); border-radius:6px; background:#f6f8fa; cursor:pointer; }
  button.main { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  .res { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .res b { width:52px; } input[type=range] { width:140px; }
  kbd { border:1px solid var(--line); border-radius:3px; padding:0 4px; }
</style>
</head>
<body>
<h1>Sensor simulator</h1>
<p class="note">Stands in for door contacts, bed sensors and wearables during the demo. Real sensors post to the same API.
Keyboard: <kbd>D</kbd> front door open/close · <kbd>W</kbd> window · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> scenarios.</p>

<section>
  <h2>Scenarios</h2>
  <button class="main" data-scn="night_elopement">1 · Night: R-07 heads for the front door</button>
  <button class="main" data-scn="night_bathroom">2 · Night: R-15 ensuite trip (should stay quiet)</button>
  <button class="main" data-scn="day_visits">3 · Day: visitors come and go</button>
  <button data-scn="reset">Reset</button>
</section>

<section>
  <h2>Clock</h2>
  <button data-time="02:08">02:08 (night)</button><button data-time="14:00">14:00 (day)</button>
  <button data-time="20:58">20:58 (night starts soon)</button>
</section>

<section>
  <h2>Doors and windows</h2>
  <div id="doors"></div>
</section>

<section>
  <h2>Residents</h2>
  <div id="res"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const send = (body) => fetch('/api/sensor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const call = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
let state = null;

async function load() {
  state = await (await fetch('/api/state')).json();
  $('doors').innerHTML = state.exits.map((e) => `<button data-exit="${e.id}" data-open="1">Open: ${e.label}</button><button data-exit="${e.id}" data-open="0">Close</button><br>`).join('');
  $('res').innerHTML = state.residents.map((r) => `<div class="res"><b>${r.id}</b>
    <button data-bed="${r.id}" data-v="0">Out of bed</button><button data-bed="${r.id}" data-v="1">Back in bed</button>
    <select data-zone="${r.id}"><option>room</option><option>corridor</option><option>common</option><option>exit</option><option>outside</option></select>
    HR <input type="range" min="50" max="130" value="${r.hr_rest}" data-hr="${r.id}"><span id="hr-${r.id}">${r.hr_rest}</span></div>`).join('');
}

document.addEventListener('click', (e) => {
  const d = e.target.dataset;
  if (d.scn) call('/api/scenario', { name: d.scn });
  if (d.time) call('/api/clock', { time: d.time, speed: 1 });
  if (d.exit) send({ type: 'door', exit: d.exit, open: d.open === '1' });
  if (d.bed) send({ type: 'bed', resident: d.bed, in_bed: d.v === '1' });
});
document.addEventListener('change', (e) => {
  const d = e.target.dataset;
  if (d.zone) send({ type: 'location', resident: d.zone, zone: e.target.value, exit: 'front' });
});
document.addEventListener('input', (e) => {
  const d = e.target.dataset;
  if (d.hr) { $('hr-' + d.hr).textContent = e.target.value; send({ type: 'hr', resident: d.hr, bpm: +e.target.value }); }
});
const doorOpen = { front: false, win12: false };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'd' || k === 'w') {
    const id = k === 'd' ? 'front' : 'win12';
    doorOpen[id] = !doorOpen[id];
    send({ type: 'door', exit: id, open: doorOpen[id] });
  }
  const scn = { 1: 'night_elopement', 2: 'night_bathroom', 3: 'day_visits' }[e.key];
  if (scn) call('/api/scenario', { name: scn });
});
load();
</script>
</body>
</html>
