<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightWatch · Presenter controls</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .nw-topbar { justify-content: space-between; }
  .live { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .live .t { font: 750 26px/1 var(--nw-font-display); font-variant-numeric: tabular-nums; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav .nw-btn { min-height: 36px; font-size: 13.5px; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 24px 32px; display: grid; gap: 16px; }
  .note { color: var(--nw-muted); margin: 0; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .scn { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .scn button {
    text-align: left; font: inherit; color: var(--nw-ink); cursor: pointer; display: grid; gap: 6px; padding: 14px 16px;
    border-radius: 14px; border: 1px solid var(--nw-line-strong); background: linear-gradient(180deg, var(--nw-surface-2), var(--nw-surface));
    transition: border-color .15s, background .15s, transform .08s;
  }
  .scn button:hover { border-color: var(--nw-accent); }
  .scn button:active { transform: translateY(1px); }
  .scn button.ran { border-color: var(--nw-accent); box-shadow: 0 0 0 3px rgba(138, 180, 255, .18); }
  .scn .r1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .scn .when { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 750; letter-spacing: .08em; }
  .scn .when.night { color: var(--nw-moon); } .scn .when.day { color: var(--nw-sun); }
  .scn b { font-size: 16.5px; }
  .scn .exp { font-size: 13px; color: var(--nw-muted); }
  .scn .exp em { font-style: normal; font-weight: 700; }
  .row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 16px; }
  @media (max-width: 860px) { .row2 { grid-template-columns: 1fr; } main { padding: 14px 16px 28px; } .nw-topbar { padding: 12px 16px; } }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .doors { display: grid; gap: 8px; }
  .door { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 12px;
          border: 1px solid var(--nw-line); border-radius: 12px; background: var(--nw-surface); }
  .door .nm { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .door .nm .nw-ico { color: var(--nw-muted); }
  .door .st { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--nw-faint); }
  .door.open { border-color: var(--nw-l3); background: var(--nw-l3-bg); }
  .door.open .st { color: #ff9aa4; } .door.open .nw-ico { color: var(--nw-l3); }
  .door .nw-btn { min-height: 38px; min-width: 92px; }
  .res { display: grid; grid-template-columns: 1fr auto auto; gap: 10px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--nw-line); }
  .res:last-child { border-bottom: 0; }
  .res .who b { display: block; font-size: 15px; } .res .who span { font-size: 12px; color: var(--nw-muted); }
  .seg { display: inline-flex; border: 1px solid var(--nw-line-strong); border-radius: 10px; overflow: hidden; }
  .seg button { font: 600 13px/1 var(--nw-font); padding: 9px 11px; border: 0; border-right: 1px solid var(--nw-line); background: var(--nw-surface); color: var(--nw-ink-2); cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .res .seg.zone { grid-column: 1 / -1; display: flex; } .res .seg.zone button { flex: 1; }
  .seg button:hover { background: var(--nw-raised); }
  .seg button[aria-pressed="true"] { background: var(--nw-accent); color: var(--nw-accent-ink); }
  .seg button.out[aria-pressed="true"] { background: var(--nw-l3); color: #fff; }
  .hr { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--nw-muted); }
  .hr b { color: var(--nw-ink); min-width: 30px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 130px; accent-color: var(--nw-accent); }
  @media (max-width: 720px) { .res { grid-template-columns: 1fr auto; } .res .hr { grid-column: 1 / -1; } input[type=range] { flex: 1; } .seg button { padding: 10px 8px; } }
</style>
</head>
<body class="nw">
<header class="nw-topbar">
  <div class="nw-brand"><div class="nw-brand-mark" id="logo"></div><div><div class="nw-brand-name">Presenter controls</div><div class="nw-brand-sub">Stands in for door contacts, bed sensors and wearables</div></div></div>
  <div class="live"><span class="nw-mode" id="mode">–</span><span class="t" id="clock">--:--:--</span><span id="status" class="nw-chip"></span></div>
  <nav class="nav" aria-label="Other screens">
    <a class="nw-btn nw-btn--ghost" href="/dashboard/" target="_blank" rel="noopener">Nurse station</a>
    <a class="nw-btn nw-btn--ghost" href="/staff/" target="_blank" rel="noopener">Staff phone</a>
    <a class="nw-btn nw-btn--ghost" href="/camera/" target="_blank" rel="noopener">Camera</a>
  </nav>
</header>
<main>
  <p class="note">Real sensors post to the same API. Keyboard:
    <span><span class="nw-kbd">1</span> <span class="nw-kbd">2</span> <span class="nw-kbd">3</span> scenarios</span>
    <span><span class="nw-kbd">D</span> front door open/close</span>
    <span><span class="nw-kbd">W</span> window room 12</span></p>

  <section class="nw-panel" aria-labelledby="h-scn">
    <div class="nw-panel-head"><h2 class="nw-panel-title" id="h-scn">Scenarios</h2>
      <button class="nw-btn nw-btn--ghost" data-scn="reset">Reset</button></div>
    <div class="scn">
      <button data-scn="night_elopement"><span class="r1"><span class="when night" data-ico="moon">02:08 · NIGHT</span><span class="nw-kbd">1</span></span>
        <b>R-07 heads for the front door</b><span class="exp">Expect <em style="color:var(--nw-l1)">heads-up</em> → <em style="color:var(--nw-l2)">urgent</em> → <em style="color:var(--nw-l3)">emergency</em> if nobody acknowledges. Walks outside after ~40 s.</span></button>
      <button data-scn="night_bathroom"><span class="r1"><span class="when night" data-ico="moon">03:00 · NIGHT</span><span class="nw-kbd">2</span></span>
        <b>R-15 ensuite trip</b><span class="exp">Normal for them: <em style="color:var(--nw-ok)">should stay quiet</em>. No alert.</span></button>
      <button data-scn="day_visits"><span class="r1"><span class="when day" data-ico="sun">14:00 · DAY</span><span class="nw-kbd">3</span></span>
        <b>Visitors come and go</b><span class="exp">Doors open and close: <em style="color:var(--nw-ok)">logged as visits</em>, no alarms.</span></button>
    </div>
  </section>

  <div class="row2">
    <section class="nw-panel" aria-labelledby="h-clock">
      <div class="nw-panel-head"><h2 class="nw-panel-title" id="h-clock">Clock</h2></div>
      <div class="btnrow">
        <button class="nw-btn" data-time="02:08" data-ico="moon">02:08 night</button>
        <button class="nw-btn" data-time="14:00" data-ico="sun">14:00 day</button>
        <button class="nw-btn" data-time="20:58" data-ico="clock">20:58 night starts soon</button>
      </div>
      <div class="nw-panel-head" style="margin:18px 0 12px"><h2 class="nw-panel-title">Doors and windows</h2></div>
      <div class="doors" id="doors"></div>
    </section>
    <section class="nw-panel" aria-labelledby="h-res">
      <div class="nw-panel-head"><h2 class="nw-panel-title" id="h-res">Residents</h2></div>
      <div id="res"></div>
    </section>
  </div>
</main>
<script src="/assets/nw.js"></script>
<script>
const { esc, icon, post } = NW;
const $ = (id) => document.getElementById(id);
const send = (body) => post('/api/sensor', body);
const call = (url, body) => post(url, body);
$('logo').innerHTML = icon('logo');
document.querySelector('[data-scn="reset"]').innerHTML = `${icon('reset')}Reset`;
document.querySelectorAll('[data-ico]').forEach((el) => el.insertAdjacentHTML('afterbegin', icon(el.dataset.ico)));

const ZONES = ['room', 'corridor', 'common', 'exit', 'outside'];
let state = null, built = false;

function build(s) {
  $('doors').innerHTML = s.exits.map((e) => `<div class="door" id="door-${esc(e.id)}">
      <span class="nm">${icon(e.kind === 'window' ? 'window' : 'door')}<span><b style="font-weight:600">${esc(e.label)}</b><br><span class="st">CLOSED</span></span></span>
      <button class="nw-btn" data-exit="${esc(e.id)}">Open</button></div>`).join('');
  $('res').innerHTML = s.residents.map((r) => `<div class="res" id="r-${esc(r.id)}">
      <div class="who"><b>${esc(r.id)}</b><span>Room ${esc(r.room)} · risk ${Math.round(r.risk * 100)}%</span></div>
      <div class="seg bed" role="group" aria-label="${esc(r.id)} bed sensor">
        <button data-bed="${esc(r.id)}" data-v="1">${icon('bed')} In bed</button><button data-bed="${esc(r.id)}" data-v="0">Up</button></div>
      <div class="seg zone" role="group" aria-label="${esc(r.id)} location">
        ${ZONES.map((z) => `<button class="${z === 'outside' ? 'out' : ''}" data-zone="${esc(r.id)}" data-z="${z}">${z[0].toUpperCase() + z.slice(1)}</button>`).join('')}</div>
      <label class="hr">${icon('heart')}<input type="range" min="50" max="130" value="${Math.round(r.hr || r.hr_rest)}" data-hr="${esc(r.id)}" aria-label="${esc(r.id)} heart rate"><b id="hr-${esc(r.id)}">${Math.round(r.hr || r.hr_rest)}</b></label>
    </div>`).join('');
  built = true;
}

function update(s) {
  state = s;
  if (!built) build(s);
  $('clock').textContent = s.clock;
  $('mode').className = 'nw-mode ' + (s.night ? 'is-night' : 'is-day');
  $('mode').innerHTML = s.night ? `${icon('moon')}NIGHT` : `${icon('sun')}DAY`;
  const top = s.alerts[0];
  $('status').innerHTML = top ? `<span class="nw-dot" style="background:var(--nw-l${top.level})"></span>${s.alerts.length} active · highest <b>level ${top.level}</b>`
    : `<span class="nw-dot is-live"></span><b>No alerts</b>`;
  for (const e of s.exits) {
    const d = $('door-' + e.id); if (!d) continue;
    d.classList.toggle('open', e.open);
    d.querySelector('.st').textContent = e.open ? 'OPEN' : 'CLOSED';
    const b = d.querySelector('button');
    b.textContent = e.open ? 'Close' : 'Open';
    b.dataset.open = e.open ? '0' : '1';
  }
  for (const r of s.residents) {
    const row = $('r-' + r.id); if (!row) continue;
    row.querySelectorAll('[data-bed]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === r.in_bed)));
    row.querySelectorAll('[data-zone]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.z === r.zone)));
    const hr = row.querySelector('[data-hr]');
    if (r.hr && document.activeElement !== hr) { hr.value = Math.round(r.hr); $('hr-' + r.id).textContent = Math.round(r.hr); }
  }
}

async function tick() { try { update(await (await fetch('/api/state')).json()); } catch { $('status').innerHTML = '<b>Server not reachable</b>'; } }

function runScenario(name) {
  call('/api/scenario', { name });
  document.querySelectorAll('.scn button').forEach((b) => b.classList.toggle('ran', b.dataset.scn === name));
  // a scenario resets the facility: let the next poll re-read live HR values
  setTimeout(tick, 400);
}
function toggleExit(id) {
  const e = state && state.exits.find((x) => x.id === id);
  send({ type: 'door', exit: id, open: !(e && e.open) }).then(tick);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.scn) runScenario(d.scn);
  if (d.time) call('/api/clock', { time: d.time, speed: 1 }).then(tick);
  if (d.exit) send({ type: 'door', exit: d.exit, open: d.open === '1' }).then(tick);
  if (d.bed) send({ type: 'bed', resident: d.bed, in_bed: d.v === '1' }).then(tick);
  if (d.zone) send({ type: 'location', resident: d.zone, zone: d.z, exit: 'front' }).then(tick);
});
document.addEventListener('input', (e) => {
  const d = e.target.dataset;
  if (d.hr) { $('hr-' + d.hr).textContent = e.target.value; send({ type: 'hr', resident: d.hr, bpm: +e.target.value }); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'd') toggleExit('front');
  if (k === 'w') toggleExit('win12');
  const scn = { 1: 'night_elopement', 2: 'night_bathroom', 3: 'day_visits' }[e.key];
  if (scn) runScenario(scn);
});
setInterval(tick, 1000); tick();
</script>
</body>
</html>
